<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA Interior Design</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#FFFBF7;color:#2B2B2B}
h1,h2{font-family:'Playfair Display',serif}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;background:#FFFBF7;border-bottom:1px solid #F0E6DA;padding:16px 0}
.header-inner{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:22px}
.btn-wa{background:#2B2B2B;color:#fff;padding:10px 20px;border-radius:30px;text-decoration:none;font-weight:600}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:80px 0;align-items:center}
.hero h1{font-size:52px;line-height:1.05}
.hero h1 span{color:#C9A87A}
.hero-img{border-radius:28px;overflow:hidden;aspect-ratio:4/5}
.hero-img img{width:100%;height:100%;object-fit:cover}
.section{padding:60px 0}
.section-title{font-size:40px;text-align:center}
.section-sub{text-align:center;color:#8A7A6E;margin:10px 0 40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{border-radius:20px;overflow:hidden;background:white;line-height:0}
.card img{width:100%;display:block}
.cta{background:#2B2B2B;color:#fff;border-radius:28px;padding:60px;text-align:center;margin-top:40px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="container header-inner"><div class="logo">LA INTERIOR DESIGN</div><a class="btn-wa" href="https://wa.me/6281234567890">Chat WA</a></div></header>
<div class="container">
<div class="hero">
<div><h1>Ruang Indah,<br>Nyaman &<br><span>Berkelas</span></h1><br><p>Kitchen set, backdrop TV, wardrobe & kamar custom.</p></div>
<div class="hero-img"><img src="IMG-20260917-WA2267.jpg"></div>
</div>
<div class="section">
<h2 class="section-title">Portfolio Terbaik Kami</h2>
<p class="section-sub">Koleksi karya terbaik kami</p>
<div class="grid">
<div class="card"><img src="IMG-20260917-WA2267.jpg"></div>
<div class="card"><img src="IMG-20260917-WA2542.jpg"></div>
<div class="card"><img src="IMG-20260917-WA2911.jpg"></div>
<div class="card"><img src="IMG-20260917-WA4617.jpg"></div>
<div class="card"><img src="IMG-20260917-WA4823.jpg"></div>
<div class="card"><img src="IMG-20260917-WA6835.jpg"></div>
<div class="card"><img src="IMG-20260917-WA7579.jpg"></div>
<div class="card"><img src="IMG-20260917-WA9526.jpg"></div>
<div class="card"><img src="IMG-20260917-WA9885.jpg"></div>
</div>
<div class="cta"><h2>Wujudkan Rumah Impianmu</h2><br><br><a class="btn-wa" style="background:#fff;color:#2B2B2B" href="https://wa.me/6281234567890">Chat WhatsApp Sekarang</a></div>
</div>
</div>
</body>
</html>
