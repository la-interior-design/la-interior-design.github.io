<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="LA INTERIOR DESIGN — jasa desain interior dan custom furniture. Kitchen set, wardrobe, TV cabinet, bedroom dan furniture custom.">
<meta name="theme-color" content="#171717">
<title>LA INTERIOR DESIGN — Interior & Custom Furniture</title>

<style>
:root {
  --bg:#f7f5f1;
  --surface:#ffffff;
  --ink:#191919;
  --muted:#6e6a63;
  --line:#e8e2d8;
  --accent:#a77b4b;
  --dark:#171717;
  --cream:#eee7dc;
  --shadow:0 18px 50px rgba(28,22,15,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

html{
  scroll-behavior:smooth
}

body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--bg);
  line-height:1.6
}

a{
  color:inherit;
  text-decoration:none
}

img{
  display:block;
  width:100%
}

.container{
  width:min(1160px,92%);
  margin:auto
}

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  background:rgba(247,245,241,.88);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(0,0,0,.06)
}

.nav{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  letter-spacing:.12em
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--dark);
  color:#fff;
  display:grid;
  place-items:center;
  font-family:Georgia,serif;
  font-size:17px;
  letter-spacing:-.08em;
  box-shadow:0 8px 20px rgba(0,0,0,.15)
}

.brand span:last-child{
  font-size:13px
}

nav{
  display:flex;
  gap:26px;
  font-size:14px;
  color:#49453f
}

nav a:hover{
  color:var(--accent)
}

.nav-cta{
  padding:10px 16px;
  border-radius:999px;
  background:var(--dark);
  color:#fff;
  font-weight:700
}

.menu{
  display:none;
  border:0;
  background:none;
  font-size:24px
}

/* HERO */
.hero{
  padding:150px 0 85px;
  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(167,123,75,.18),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #f7f5f1 0%,
      #f1ece4 100%
    )
}

.hero-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:60px;
  align-items:center
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--accent);
  font-size:12px;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:18px
}

.eyebrow:before{
  content:"";
  width:28px;
  height:1px;
  background:var(--accent)
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:500;
  font-size:clamp(48px,6vw,82px);
  line-height:.98;
  letter-spacing:-.045em;
  margin-bottom:25px
}

h1 em{
  font-style:italic;
  color:var(--accent)
}

.hero p{
  font-size:18px;
  color:var(--muted);
  max-width:610px;
  margin-bottom:32px
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:14px 20px;
  border-radius:999px;
  font-weight:750;
  border:1px solid var(--dark);
  transition:.25s
}

.btn-dark{
  background:var(--dark);
  color:#fff
}

.btn-dark:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 25px rgba(0,0,0,.15)
}

.btn-light{
  background:transparent
}

.btn-light:hover{
  background:#fff
}
