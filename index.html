<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA INTERIOR DESIGN - Interior • Furniture • Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--beige:#F9F6F1;--beige2:#EFE8DD;--black:#121212;--gold:#A68060;--text:#6B6B6B}
body{font-family:'Inter',sans-serif;background:var(--beige);color:var(--black);line-height:1.6}
h1,h2,h3{font-family:'Playfair Display',serif}
.container{max-width:1200px;margin:0 auto;padding:0 24px}

/* HEADER - Persis screenshot */
header{position:sticky;top:0;z-index:100;background:var(--beige);border-bottom:1px solid #E8E0D5;padding:14px 0}
.header-inner{display:flex;justify-content:space-between;align-items:center}
.logo-wrap{display:flex;align-items:center;gap:14px}
.logo-box{width:52px;height:52px;border:1.5px solid var(--black);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:22px}
.logo-text b{display:block;font-size:16px;letter-spacing:2px;line-height:1}
.logo-text span{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:400}
.menu{font-size:28px;cursor:pointer}

/* PROJECT CARD - Persis screenshot */
.project{margin-bottom:28px;background:white;border:1px solid #EAE3D9;overflow:hidden}
.project img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.project-info{padding:28px 26px}
.project-info small{color:var(--gold);letter-spacing:3px;font-size:12px;font-weight:600}
.project-info h3{font-size:28px;margin:8px 0 10px;line-height:1.2}
.project-info p{color:var(--text);font-size:15px;font-weight:300}

/* CARA KERJA - Background hitam persis screenshot */
.cara-kerja{background:var(--black);color:white;padding:80px 24px;margin-top:40px}
.cara-kerja small{color:var(--gold);letter-spacing:4px;font-size:12px;font-weight:600}
.cara-kerja h2{font-size:42px;line-height:1.1;margin:18px 0 20px;max-width:500px}
.cara-kerja .desc{color:#A8A8A8;font-weight:300;max-width:600px;margin-bottom:60px}
.steps{border-top:1px solid #2A2A2A;padding:40px 0;display:grid;grid-template-columns:80px 1fr;gap:20px}
.steps b{color:var(--gold);font-family:'Playfair Display',serif;font-size:22px;font-weight:500}
.steps h4{font-size:24px;margin-bottom:10px}
.steps p{color:#A8A8A8;font-weight:300;font-size:15px;max-width:500px}

/* CTA - Persis screenshot */
.cta{background:var(--beige2);margin:0 24px;padding:60px 36px;border-radius:4px}
.cta small{color:var(--gold);letter-spacing:3px;font-size:12px;font-weight:600}
.cta h2{font-size:44px;line-height:1.1;margin:20px 0;max-width:600px}
.cta p{color:var(--text);max-width:500px;margin-bottom:32px;font-weight:300}
.btn-black{background:var(--black);color:white;padding:18px 36px;display:inline-block;text-decoration:none;font-size:14px;letter-spacing:1px;border-radius:6px;font-weight:500}

/* KONTAK - Persis screenshot */
.kontak{padding:80px 24px;background:var(--beige)}
.kontak small{color:var(--gold);letter-spacing:4px;font-size:12px;font-weight:600}
.kontak h2{font-size:52px;line-height:0.95;margin:20px 0 40px}
.kontak-item{display:flex;gap:20px;padding:24px 0;border-top:1px solid #E8E0D5;border-bottom:1px solid #E8E0D5;margin-bottom:0}
.kontak-icon{width:56px;height:56px;background:var(--beige2);display:flex;align-items:center;justify-content:center;font-size:20px}
.kontak-item b{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:600;display:block;margin-bottom:6px}
.kontak-item p{font-weight:600;font-size:18px;line-height:1.3}

/* WA Floating - Persis screenshot */
.wa-float{position:fixed;bottom:24px;right:24px;width:64px;height:64px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:99}
.wa-float img{width:32px}

@media(max-width:768px){
  .cta h2{font-size:32px}
  .kontak h2{font-size:38px}
  .cara-kerja h2{font-size:32px}
  .project-info h3{font-size:24px}
}
</style>
</head>
<body>

<header>
<div class="container header-inner">
<div class="logo-wrap">
<div class="logo-box">LA</div>
<div class="logo-text"><b>LA INTERIOR DESIGN</b><span>INTERIOR • FURNITURE • DETAIL</span></div>
</div>
<div class="menu">☰</div>
</div>
</header>

<div class="container" style="padding-top:32px">

<img src="https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=1200">
<div class="project-info"><small>PROJECT 04</small><h3>Dapur Modern</h3><p>Kitchen set custom dengan kombinasi wood, marble & dark tone</p></div>
</div>

<img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200">
